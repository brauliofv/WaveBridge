<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>WaveBridge Emisor</title>
    <style>
      body {
        width: 330px;
        margin: 0;
        padding: 16px;
        background: #0b0d10;
        color: #f4f5f7;
        font-family: system-ui, -apple-system, sans-serif;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 4px 0;
      }
      p {
        font-size: 12px;
        color: #9ca3af;
        margin: 0 0 14px 0;
        line-height: 1.4;
      }
      label {
        display: block;
        font-size: 11px;
        color: #9ca3af;
        margin-bottom: 5px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 9px 11px;
        border-radius: 8px;
        border: 1px solid #232933;
        background: #13171d;
        color: #f4f5f7;
        font-size: 13px;
        margin-bottom: 10px;
      }
      input.code {
        font-family: monospace;
        font-size: 15px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      button.primary {
        width: 100%;
        padding: 10px 14px;
        border: 0;
        border-radius: 8px;
        background: #0ea5e9;
        color: #06121a;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      button.primary.stop {
        background: #dc2626;
        color: #fff;
      }
      .status {
        margin-top: 12px;
        font-size: 12px;
        color: #9ca3af;
        line-height: 1.4;
      }
      .footer {
        margin-top: 14px;
        padding-top: 10px;
        border-top: 1px solid #1f2630;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 10px;
        color: #6b7280;
      }
      .diag-btn {
        background: none;
        border: 0;
        padding: 0;
        color: #9ca3af;
        font-size: 10px;
        cursor: pointer;
        text-decoration: underline;
      }
      .diag-btn:hover {
        color: #f4f5f7;
      }
    </style>
  </head>
  <body>
    <h1>WaveBridge</h1>
    <p>Transmite el audio de esta pestaña por Wi-Fi hacia la app WaveBridge en tu smartphone Android.</p>

    <label for="serverUrl">Servidor puente (URL o IP local Wi-Fi)</label>
    <input id="serverUrl" type="url" placeholder="http://192.168.1.50:3000" />

    <label for="roomCode">Código de sala (6 caracteres)</label>
    <input id="roomCode" class="code" maxlength="6" placeholder="WVB492" />

    <button id="toggleBtn" class="primary">Transmitir pestaña activa</button>
    <div id="status" class="status">Listo para capturar audio</div>

    <div class="footer">
      <span id="versionMeta">v1.0.0 · 2026-11-22</span>
      <button id="copyDiagBtn" class="diag-btn" type="button">Reportar error</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
